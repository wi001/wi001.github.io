<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>William Isaksson</title>
  <meta name="description" content="William Isaksson — contact.">

  <!-- ============================================================
       This is a minimal personal page meant to be linked from a
       paper for attribution. To add more later, see the comments
       marked  EDIT:  below.
       ============================================================ -->

  <style>
    :root {
      --ink:   #1a1a1a;
      --muted: #6b6b6b;
      --line:  #e6e6e6;
      --accent:#1a1a1a;
      --bg:    #ffffff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --ink:   #ededed;
        --muted: #9a9a9a;
        --line:  #2a2a2a;
        --accent:#ededed;
        --bg:    #111111;
      }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 17px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      -webkit-font-smoothing: antialiased;
    }
    main {
      width: 100%;
      max-width: 30rem;
      text-align: center;
    }
    h1 {
      font-size: 2rem;
      font-weight: 600;
      letter-spacing: -0.01em;
      margin: 0 0 0.4rem;
    }
    /* EDIT: uncomment and fill in to show a role / affiliation under your name.
    .tagline { color: var(--muted); margin: 0 0 2rem; }
    */
    .links {
      list-style: none;
      margin: 2rem 0 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }
    .links a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      color: var(--accent);
      text-decoration: none;
      padding: 0.7rem 1rem;
      border-radius: 0.6rem;
      transition: background 0.15s ease;
    }
    .links a:hover { background: color-mix(in srgb, var(--ink) 7%, transparent); }
    .links .label { border-bottom: 1px solid var(--line); padding-bottom: 1px; }
    footer {
      margin-top: 2.5rem;
      color: var(--muted);
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <main>
    <h1>William Isaksson</h1>

    <!-- EDIT: a one-line role/affiliation, if you want one. Then also
         uncomment the .tagline style block above.
    <p class="tagline">Contributor &middot; Paper Title</p>
    -->

    <ul class="links">
      <li>
        <a href="mailto:williamisacs@gmail.com">
          <span class="label">williamisacs@gmail.com</span>
        </a>
      </li>
      <li>
        <a href="https://github.com/wi001" rel="me">
          <span class="label">github.com/wi001</span>
        </a>
      </li>
      <!-- EDIT: add more links the same way, e.g.
      <li><a href="https://orcid.org/0000-0000-0000-0000"><span class="label">ORCID</span></a></li>
      <li><a href="https://arxiv.org/abs/XXXX.XXXXX"><span class="label">Paper (arXiv)</span></a></li>
      -->
    </ul>
  </main>
</body>
</html>
